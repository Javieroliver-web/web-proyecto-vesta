server {
    server_name vesta-web.duckdns.org;

    # Redirección de la raíz a /vesta-web/
    location = / {
        return 301 https://$host/vesta-web/;
    }

    # Configuración para todas las rutas de la aplicación web
    location /vesta-web/ {
        proxy_pass http://localhost:8080/vesta-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-web /;
    }

    # Configuración para la API - CORREGIDA
    location /vesta-api/ {
        proxy_pass http://localhost:8080/vesta-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-api /;
        
        # Configuración adicional para CORS y cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Configuración para la API (proxy legacy)
    location /api/ {
        proxy_pass http://localhost:8080/vesta-api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-api /;
        
        # Configuración adicional para CORS y cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Configuración para rutas del cliente (dashboard, etc.)
    location /cliente/ {
        proxy_pass http://localhost:8080/vesta-web/cliente/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-web /;
    }

    # Redirección para URLs sin /vesta-web/ prefix
    location ~ ^/(login|register|cliente|admin)(.*)$ {
        return 301 https://$host/vesta-web/$1$2;
    }

    # Configuración para rutas de administrador
    location /admin/ {
        proxy_pass http://localhost:8080/vesta-web/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-web /;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vesta-web.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vesta-web.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = vesta-web.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name vesta-web.duckdns.org;
    listen 80;
    return 404; # managed by Certbot
}