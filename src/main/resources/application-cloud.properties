# ===================================
# VESTA WEB - Cloud Hosting Profile
# ===================================
# Perfil para hosting gratuito permanente: Koyeb
# Activar con variable de entorno: SPRING_PROFILES_ACTIVE=cloud
#
# Variables de entorno requeridas en Koyeb:
#   API_URL              -> URL de la API backend (ej: https://vesta-api.koyeb.app/vesta-api/api)
#   GOOGLE_CLIENT_ID     -> Client ID de Google OAuth2
#   GOOGLE_CLIENT_SECRET -> Client Secret de Google OAuth2

# === SERVIDOR ===
# Koyeb inyecta el puerto via variable PORT
server.port=${PORT:80}
server.servlet.context-path=/vesta-web
spring.application.name=vesta-web

# === CONEXIÓN CON LA API (BACKEND) ===
api.url=${API_URL:https://vesta-api.koyeb.app/vesta-api/api}

# === THYMELEAF ===
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === LOGGING ===
logging.level.com.vesta.web=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# === SESSION ===
server.servlet.session.timeout=30m

# === COMPRESIÓN ===
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# === STATIC RESOURCES CACHING ===
spring.web.resources.cache.cachecontrol.max-age=365d

# === OAuth2 GOOGLE LOGIN ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# URI dinámica - Spring la resuelve automáticamente con el dominio real del servidor
# IMPORTANTE: Registrar esta URI en Google Cloud Console:
#   https://[tu-app].koyeb.app/vesta-web/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

# === HTTPS (detrás del reverse proxy de Koyeb) ===
server.forward-headers-strategy=native
