# ================================================================
# PERFIL DE PRODUCCIÓN — CONFIGURACIÓN ORACLE CLOUD / GOOGLE CLOUD VM
# ================================================================
# CONSERVAR para reactivación futura de cualquier VM.
# Para reactivar, ver: GOOGLE_CLOUD_README.md en la raíz del proyecto
#
# Este perfil se activa con: SPRING_PROFILES_ACTIVE=prod
# en Docker Compose (Oracle Cloud, Google Cloud, etc.)
# ================================================================

# === CONFIGURACIÓN DEL SERVIDOR WEB ===
server.port=8080
server.servlet.context-path=/vesta-web
spring.application.name=vesta-web

# === CONEXIÓN CON LA API (BACKEND) ===
# En Docker Compose: la API es accesible por su nombre de servicio interno
# API_URL se inyecta como variable de entorno desde docker-compose.yml
api.url=${API_URL:http://vesta-api:8080/vesta-api/api}

# === CONFIGURACIÓN DE THYMELEAF (VISTAS) ===
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === LOGS ===
logging.level.com.vesta.web=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# === SESSION ===
server.servlet.session.timeout=30m

# === COMPRESSION ===
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# === STATIC RESOURCES CACHING ===
spring.web.resources.cache.cachecontrol.max-age=365d

# === HTTPS (detrás del reverse proxy Nginx) ===
server.forward-headers-strategy=native

# === OAUTH2 SOCIAL LOGIN (PROD - HTTPS) ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# URI dinámica — Spring la resuelve con el dominio real del servidor
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
