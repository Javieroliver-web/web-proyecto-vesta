# === PRODUCTION PROFILE ===
# This configuration is used in production environment (Docker)

# === CONFIGURACIÓN DEL SERVIDOR WEB ===

server.port=80
spring.application.name=vesta-web

# === CONEXIÓN CON LA API (BACKEND) ===
api.url=http://vesta-web.duckdns.org:8080/vesta-api/api

# === CONFIGURACIÓN DE THYMELEAF (VISTAS) ===
# Activar caché en producción para mejor rendimiento
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === LOGS ===
# === LOGS ===
logging.level.com.vesta.web=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# === SESSION ===
server.servlet.session.timeout=30m

# === COMPRESSION ===
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# === STATIC RESOURCES CACHING ===
spring.web.resources.cache.cachecontrol.max-age=365d

# === OAUTH2 SOCIAL LOGIN (PROD - HTTPS) ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://vesta-web.duckdns.org/vesta-web/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
