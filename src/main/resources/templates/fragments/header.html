<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="header-nav" class="navbar navbar-expand-lg shadow-sm"
        style="border-bottom: 3px solid #f1a61c; background-color: #282c3f;">

        <script th:inline="javascript">
            (function () {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                }
                /*<![CDATA[*/
                const userId = /*[[${session.usuarioId}]]*/ null;
                const token = /*[[${session.token}]]*/ null;
                /*]]>*/
                if (userId && token) {
                    const apiBase = window.location.hostname === 'localhost' ? 'https://localhost:8080/api' : '/vesta-web/usuario/api';
                    fetch(`${apiBase}/${userId}`, { credentials: 'include' })
                        .then(res => res.ok ? res.json() : null)
                        .then(user => {
                            if (user && user.tema) {
                                localStorage.setItem('theme', user.tema);
                                document.documentElement.setAttribute('data-theme', user.tema);
                            }
                        }).catch(e => { });
                }
            })();
        </script>

        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#" style="cursor: default;">
                <img th:src="@{/images/logo_vesta_sin_fondo.png}" alt="VESTA" style="height: 40px;">
            </a>

            <!-- Toggler para móvil -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#vestaNavbar" aria-controls="vestaNavbar" aria-expanded="false"
                aria-label="Toggle navigation" th:if="${session.token != null}">
                <i class="bi bi-list text-warning fs-1"></i>
            </button>

            <div class="collapse navbar-collapse" id="vestaNavbar" th:if="${session.token != null}">
                <!-- Navegación -->
                <ul class="navbar-nav me-auto ms-lg-4 gap-2 gap-lg-3 mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a th:href="@{/cliente/dashboard}" class="nav-link text-white fw-semibold">
                            <i class="bi bi-house-door me-1"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/cliente/marketplace}" class="nav-link text-white fw-semibold">
                            <i class="bi bi-shop me-1"></i> Marketplace
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/cliente/mis-polizas}" class="nav-link text-white fw-semibold">
                            <i class="bi bi-file-text me-1"></i> Mis Pólizas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/cliente/tpv-simulator}" class="nav-link text-white fw-semibold">
                            <i class="bi bi-credit-card me-1"></i> TPV Virtual
                        </a>
                    </li>
                </ul>

                <!-- Acciones Usuario -->
                <div
                    class="d-flex align-items-center gap-3 mt-3 mt-lg-0 pb-3 pb-lg-0 border-top border-secondary pt-3 pt-lg-0 border-top-0-lg">
                    <span class="me-2 text-light d-none d-lg-inline">
                        Hola, <span th:text="${session.usuarioNombre}" class="text-warning fw-bold">Usuario</span>
                    </span>
                    <!-- Mobile only user name -->
                    <span class="d-lg-none text-warning fw-bold mb-2 w-100"
                        th:text="${session.usuarioNombre}">Usuario</span>

                    <a th:href="@{/cliente/configuracion}" class="btn btn-sm btn-outline-light" title="Configuración"
                        style="border-color: rgba(244, 185, 76, 0.5); color: #f4b94c;">
                        <i class="bi bi-gear-fill"></i> <span class="d-lg-none ms-2">Configuración</span>
                    </a>

                    <a th:href="@{/logout}" class="btn btn-sm fw-bold"
                        style="background: linear-gradient(135deg, #f1a61c 0%, #f4b94c 100%); color: white; border: none;">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </a>
                </div>
            </div>
        </div>
    </nav>
</body>

</html>
