<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="mobile-nav" class="bottom-nav d-md-none">
        <style>
            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--theme-card-bg, white);
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
                padding: 0.5rem 0;
                z-index: 1050;
                display: flex;
                border-top: 1px solid var(--theme-border, #dee2e6);
            }

            [data-theme="dark"] .bottom-nav {
                background: var(--vesta-navy);
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
                border-top-color: var(--vesta-gold);
            }

            .nav-item {
                flex: 1;
                text-align: center;
                position: relative;
                padding: 0.5rem;
                color: var(--theme-text-muted, #6c757d);
                text-decoration: none;
                transition: all 0.3s;
            }

            .nav-item:hover {
                color: var(--vesta-gold);
            }

            .nav-item.active {
                color: var(--vesta-gold);
            }

            .nav-item.active::before {
                content: '';
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 40px;
                height: 4px;
                background: var(--vesta-gold);
                border-radius: 0 0 4px 4px;
            }
        </style>

        <a href="/vesta-web/cliente/dashboard" class="nav-item active">
            <i class="bi bi-house-door fs-5 d-block"></i>
            <small>Inicio</small>
        </a>
        <a href="/vesta-web/cliente/marketplace" class="nav-item">
            <i class="bi bi-shop fs-5 d-block"></i>
            <small>Tienda</small>
        </a>
        <a href="/vesta-web/cliente/mis-polizas" class="nav-item">
            <i class="bi bi-shield-check fs-5 d-block"></i>
            <small>Pólizas</small>
        </a>
        <a href="/vesta-web/cliente/configuracion" class="nav-item">
            <i class="bi bi-person fs-5 d-block"></i>
            <small>Perfil</small>
        </a>
    </nav>
</body>

</html>
