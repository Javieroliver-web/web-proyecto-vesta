<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Gestión de Pólizas - Vesta Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div th:replace="~{fragments/favicon :: favicon}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=3.4)}">
    <!-- Librerías para Exportación y PDF -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <div class="d-flex flex-column flex-md-row">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='polizas')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="page-title-premium">Gestión de Pólizas</h2>
                    <p class="text-muted small mb-0">Administra, filtra y exporta el historial de seguros</p>
                </div>
                <button class="btn btn-success" onclick="exportToExcel()">
                    <i class="bi bi-file-earmark-excel me-2"></i>Exportar Excel
                </button>
            </div>

            <!-- Toolbar de Filtros -->
            <div class="card shadow-sm border-0 mb-4 bg-light">
                <div class="card-body py-3">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <div class="search-expandable">
                                <input type="text" id="searchPoliza" placeholder="Buscar póliza...">
                                <div class="search-expandable-icon">
                                    <i class="bi bi-search"></i>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="filterEstado" onchange="applyFilters()">
                                <option value="">Todos los Estados</option>
                                <option value="ACTIVA">Activa</option>
                                <option value="INACTIVA">Inactiva</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="date" class="form-control" id="filterFecha" onchange="applyFilters()"
                                title="Filtrar por fecha de inicio">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">
                                <i class="bi bi-x-circle me-1"></i>Limpiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Estado</th>
                                <th>Vigencia</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="polizaTableBody">
                            <tr th:each="p : ${polizas}">
                                <td class="text-muted fw-bold">#<span th:text="${p.id}">1</span></td>
                                <td>
                                    <div class="d-flex flex-column">
                                        <span class="fw-bold" th:text="${p.usuario.nombreCompleto}">Nombre</span>
                                        <small class="text-muted" th:text="${p.usuario.email}">email</small>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border"
                                        th:text="${p.producto.nombre}">Seguro</span>
                                </td>
                                <td class="text-end fw-bold text-primary" th:text="${p.precioFinal} + '€'">0€</td>
                                <td>
                                    <span th:if="${p.estado == 'ACTIVA'}"
                                        class="badge bg-success bg-opacity-10 text-success">ACTIVA</span>
                                    <span th:if="${p.estado != 'ACTIVA'}" class="badge bg-secondary">INACTIVA</span>
                                </td>
                                <td>
                                    <small class="d-block text-muted">
                                        <i class="bi bi-calendar-event"></i> <span
                                            th:text="${p.fechaFin}">2026-01-01</span>
                                    </small>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"
                                        th:onclick="verDetalle([[${p.id}]], [[${p.usuario.nombreCompleto}]], [[${p.producto.nombre}]], [[${p.precioFinal}]], [[${p.fechaInicio}]], [[${p.fechaFin}]])">
                                        <i class="bi bi-eye"></i> Detalle
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(polizas)}">
                                <td colspan="7" class="text-center py-5 text-muted">No hay pólizas registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalPoliza" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Detalle de Póliza #<span id="detailId"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h5 class="text-center mb-4"><i class="bi bi-shield-check text-warning display-4"></i></h5>

                    <div class="list-group list-group-flush">
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Titular</span>
                            <span class="fw-bold" id="detailUsuario"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Producto</span>
                            <span class="fw-bold text-primary" id="detailProducto"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Precio Anual</span>
                            <span class="fw-bold" id="detailPrecio"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Fecha Inicio</span>
                            <span id="detailInicio"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Fecha Fin</span>
                            <span id="detailFin" class="text-danger fw-bold"></span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-warning fw-bold"
                        style="background-color: #bcb426; border-color: #bcb426; color: white;" onclick="generatePDF()">
                        <i class="bi bi-file-earmark-pdf me-2"></i>Descargar Certificado
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/modal-utils.js}"></script>
    <script>
        // Función para abrir el modal de detalles
        function verDetalle(id, usuario, producto, precio, inicio, fin) {
            document.getElementById('detailId').innerText = id;
            document.getElementById('detailUsuario').innerText = usuario;
            document.getElementById('detailProducto').innerText = producto;
            document.getElementById('detailPrecio').innerText = precio + '€';
            document.getElementById('detailInicio').innerText = inicio;
            document.getElementById('detailFin').innerText = fin;

            // Abrir el modal
            var myModal = new bootstrap.Modal(document.getElementById('modalPoliza'));
            myModal.show();
        }

        // --- LÓGICA DE FILTROS ---
        document.getElementById('searchPoliza').addEventListener('keyup', applyFilters);

        function applyFilters() {
            const searchText = document.getElementById('searchPoliza').value.toLowerCase();
            const statusFilter = document.getElementById('filterEstado').value;
            const dateFilter = document.getElementById('filterFecha').value; // YYYY-MM-DD format

            const rows = document.querySelectorAll('#polizaTableBody tr');

            rows.forEach(row => {
                if (row.classList.contains('no-data')) return;

                const text = row.innerText.toLowerCase();
                const statusBadge = row.querySelector('.badge');
                const status = statusBadge ? (statusBadge.classList.contains('bg-success') ? 'ACTIVA' : 'INACTIVA') : '';

                // Extraer fecha (asumiendo formato YYYY-MM-DD en la columna 5, index 4 o 5)
                // En la tabla actual: col 5 es vigencia, contiene fecha fin. La fecha inicio no está directa en columna.
                // Modificaremos para usar el texto visible.

                let matchesSearch = text.includes(searchText);
                let matchesStatus = statusFilter === '' || status === statusFilter;

                // Filtro fecha simple: si la fila contiene la fecha seleccionada
                let matchesDate = dateFilter === '' || text.includes(dateFilter);

                row.style.display = (matchesSearch && matchesStatus && matchesDate) ? '' : 'none';
            });
        }

        function clearFilters() {
            document.getElementById('searchPoliza').value = '';
            document.getElementById('filterEstado').value = '';
            document.getElementById('filterFecha').value = '';
            applyFilters();
        }

        // --- LÓGICA DE EXPORTACIÓN ---
        function exportToExcel() {
            const table = document.querySelector(".table");
            /* clonar tabla para no modificar la visible si quisiéramos quitar columnas, pero aquí exportamos todo */
            const wb = XLSX.utils.table_to_book(table, { sheet: "Pólizas" });
            XLSX.writeFile(wb, "Reporte_Polizas_Vesta.xlsx");
        }

        // --- LÓGICA DE PDF ---
        function generatePDF() {
            const id = document.getElementById('detailId').innerText;
            const usuario = document.getElementById('detailUsuario').innerText;
            const producto = document.getElementById('detailProducto').innerText;
            const precio = document.getElementById('detailPrecio').innerText;

            // Crear contenido temporal para el PDF
            const element = document.createElement('div');
            element.innerHTML = `
                <div style="padding: 40px; font-family: Helvetica, Arial, sans-serif; color: #333;">
                    <div style="text-align: center; margin-bottom: 40px;">
                        <h1 style="color: #f1a61c; font-size: 30px;">CERTIFICADO DE SEGURO</h1>
                        <p style="color: #666;">Documento Oficial Vesta Seguros</p>
                    </div>
                    
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 30px;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <tr>
                                <td style="padding: 10px; font-weight: bold;">Póliza Nº:</td>
                                <td style="padding: 10px;">${id}</td>
                            </tr>
                            <tr>
                                <td style="padding: 10px; font-weight: bold;">Titular:</td>
                                <td style="padding: 10px;">${usuario}</td>
                            </tr>
                            <tr>
                                <td style="padding: 10px; font-weight: bold;">Producto Asegurado:</td>
                                <td style="padding: 10px;">${producto}</td>
                            </tr>
                            <tr>
                                <td style="padding: 10px; font-weight: bold;">Cobertura:</td>
                                <td style="padding: 10px;">Completa (Todo Riesgo)</td>
                            </tr>
                             <tr>
                                <td style="padding: 10px; font-weight: bold;">Prima Anual:</td>
                                <td style="padding: 10px;">${precio}</td>
                            </tr>
                        </table>
                    </div>
                    
                    <div style="text-align: center; margin-top: 50px; font-size: 12px; color: #999;">
                        <p>Este documento certifica la validez de la póliza contratada en Vesta Seguros.</p>
                        <p>Generado electrónicamente el ${new Date().toLocaleDateString()}</p>
                    </div>
                </div>
            `;

            const opt = {
                margin: 1,
                filename: `Certificado_Poliza_${id}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // New Promise-based usage:
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>

</html>
