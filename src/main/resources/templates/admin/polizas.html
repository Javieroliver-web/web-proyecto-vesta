<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Pólizas - Vesta Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='polizas')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-warning">📝 Gestión Global de Pólizas</h2>
                <div class="input-group w-25">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchPoliza" placeholder="Buscar por ID, Usuario...">
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Estado</th>
                                <th>Vigencia</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="polizaTableBody">
                            <tr th:each="p : ${polizas}">
                                <td class="text-muted fw-bold">#<span th:text="${p.id}">1</span></td>
                                <td>
                                    <div class="d-flex flex-column">
                                        <span class="fw-bold" th:text="${p.usuario.nombreCompleto}">Nombre</span>
                                        <small class="text-muted" th:text="${p.usuario.email}">email</small>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${p.producto.nombre}">Seguro</span>
                                </td>
                                <td class="text-end fw-bold text-primary" th:text="${p.precioFinal} + '€'">0€</td>
                                <td>
                                    <span th:if="${p.estado == 'ACTIVA'}" class="badge bg-success bg-opacity-10 text-success">ACTIVA</span>
                                    <span th:if="${p.estado != 'ACTIVA'}" class="badge bg-secondary">INACTIVA</span>
                                </td>
                                <td>
                                    <small class="d-block text-muted">
                                        <i class="bi bi-calendar-event"></i> <span th:text="${p.fechaFin}">2026-01-01</span>
                                    </small>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" th:onclick="verDetalle([[${p.id}]], [[${p.usuario.nombreCompleto}]], [[${p.producto.nombre}]], [[${p.precioFinal}]], [[${p.fechaInicio}]], [[${p.fechaFin}]])">
                                        <i class="bi bi-eye"></i> Detalle
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(polizas)}">
                                <td colspan="7" class="text-center py-5 text-muted">No hay pólizas registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalPoliza" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Detalle de Póliza #<span id="detailId"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h5 class="text-center mb-4"><i class="bi bi-shield-check text-warning display-4"></i></h5>
                    
                    <div class="list-group list-group-flush">
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Titular</span>
                            <span class="fw-bold" id="detailUsuario"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Producto</span>
                            <span class="fw-bold text-primary" id="detailProducto"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Precio Anual</span>
                            <span class="fw-bold" id="detailPrecio"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Fecha Inicio</span>
                            <span id="detailInicio"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between">
                            <span class="text-muted">Fecha Fin</span>
                            <span id="detailFin" class="text-danger fw-bold"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/modal-utils.js}"></script>
    <script>
        // Filtro de búsqueda
        document.getElementById('searchPoliza').addEventListener('keyup', function() {
            const value = this.value.toLowerCase();
            const rows = document.querySelectorAll('#polizaTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(value) ? '' : 'none';
            });
        });

        function verDetalle(id, usuario, producto, precio, inicio, fin) {
            document.getElementById('detailId').innerText = id;
            document.getElementById('detailUsuario').innerText = usuario;
            document.getElementById('detailProducto').innerText = producto;
            document.getElementById('detailPrecio').innerText = precio + '€';
            document.getElementById('detailInicio').innerText = inicio;
            document.getElementById('detailFin').innerText = fin;
            new bootstrap.Modal(document.getElementById('modalPoliza')).show();
        }
    </script>
</body>
</html>
