<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Usuarios - Vesta Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div th:replace="~{fragments/favicon :: favicon}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=3.4)}">
    <!-- Librería para Exportación -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="d-flex flex-column flex-md-row">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='usuarios')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title-premium">Gestión de Usuarios</h2>
                <p class="text-muted small mb-0">Gestiona accesos y exporta el listado de clientes</p>
                <button class="btn btn-success" onclick="exportToExcel()">
                    <i class="bi bi-file-earmark-excel me-2"></i>Exportar Excel
                </button>
            </div>

            <!-- Toolbar de Filtros -->
            <div class="card shadow-sm border-0 mb-4 bg-light">
                <div class="card-body py-3">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <div class="search-expandable">
                                <input type="text" id="searchUser" placeholder="Buscar usuario...">
                                <div class="search-expandable-icon">
                                    <i class="bi bi-search"></i>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="filterRol" onchange="applyFilters()">
                                <option value="">Todos los Roles</option>
                                <option value="ADMIN">Admin</option>
                                <option value="USER">Usuario</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                             <select class="form-select" id="filterStatus" onchange="applyFilters()">
                                <option value="">Estado</option>
                                <option value="ACTIVO">Activo</option>
                                <option value="BLOQUEADO">Bloqueado</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">
                                <i class="bi bi-x-circle me-1"></i>Limpiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Contacto</th>
                                <th>Ubicación</th>
                                <th>Edad</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr th:each="u : ${usuarios}">
                                <td class="text-muted fw-bold">#<span th:text="${u.id}">1</span></td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-circle bg-light text-primary me-2 rounded-circle d-flex align-items-center justify-content-center" style="width:35px;height:35px;">
                                            <i class="bi bi-person-fill"></i>
                                        </div>
                                        <div>
                                            <div class="fw-bold" th:text="${u.nombreCompleto}">Nombre</div>
                                            <small class="text-muted" th:if="${u.fechaCreacionObj}" th:text="'Reg: ' + ${#temporals.format(u.fechaCreacionObj, 'dd/MM/yyyy')}">01/01/2024</small>
                                            <small class="text-muted" th:unless="${u.fechaCreacionObj}" th:text="${u.fechaCreacion != null} ? ('Reg: ' + u.fechaCreacion) : '-'">-</small>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex flex-column">
                                        <small><i class="bi bi-envelope me-1"></i> <span th:text="${u.email}">email</span></small>
                                        <small class="text-muted" th:if="${u.movil}"><i class="bi bi-phone me-1"></i> <span th:text="${u.movil}">600...</span></small>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${u.ciudad}" th:text="${u.ciudad}">Sevilla</span>
                                    <span th:unless="${u.ciudad}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${u.edad}" th:text="${u.edad} + ' años'">25 años</span>
                                    <span th:unless="${u.fechaNacimiento}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:class="${'badge ' + (u.rol == 'ADMIN' ? 'bg-warning text-dark' : 'bg-info bg-opacity-10 text-info border border-info')}" 
                                          th:text="${u.rol}">USER</span>
                                </td>
                                <td>
                                    <span th:if="${u.activo == true}" class="badge bg-success bg-opacity-10 text-success border border-success">ACTIVO</span>
                                    <span th:if="${u.activo == false}" class="badge bg-danger bg-opacity-10 text-danger border border-danger">BLOQUEADO</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary me-1" 
                                            th:onclick="verDetalle([[${u.id}]], [[${u.nombreCompleto}]], [[${u.email}]], [[${u.ciudad}]], [[${u.rol}]], [[${u.movil}]], [[${u.fechaNacimiento}]], [[${u.direccion}]])">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    
                                    <!-- Botón Bloquear/Desbloquear -->
                                    <div th:if="${u.rol != 'ADMIN'}" class="d-inline">
                                        <button th:if="${u.activo == true}" class="btn btn-sm btn-outline-danger" 
                                                th:onclick="toggleEstado([[${u.id}]], false, [[${u.nombreCompleto}]])">
                                            <i class="bi bi-ban"></i>
                                        </button>
                                        <button th:if="${u.activo == false}" class="btn btn-sm btn-outline-success" 
                                                th:onclick="toggleEstado([[${u.id}]], true, [[${u.nombreCompleto}]])">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="mb-3">
                        <i class="bi bi-person-circle display-1 text-secondary"></i>
                    </div>
                    <h4 id="detailNombre" class="fw-bold"></h4>
                    <p id="detailEmail" class="text-muted mb-4"></p>
                    
                    <div class="row text-start bg-light p-3 rounded mx-2">
                        <div class="col-6 mb-2"><small class="text-muted d-block">ID</small> <span id="detailId" class="fw-bold"></span></div>
                        <div class="col-6 mb-2"><small class="text-muted d-block">Rol</small> <span id="detailRol" class="fw-bold"></span></div>
                        
                        <div class="col-6 mb-2"><small class="text-muted d-block">Teléfono</small> <span id="detailMovil"></span></div>
                        <div class="col-6 mb-2"><small class="text-muted d-block">Nacimiento</small> <span id="detailNacimiento"></span></div>
                        
                        <div class="col-6 mb-2"><small class="text-muted d-block">Ciudad</small> <span id="detailCiudad"></span></div>
                        <div class="col-12"><small class="text-muted d-block">Dirección</small> <span id="detailDireccion"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/modal-utils.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const token = [[${session.token}]];
        /*]]>*/
        const apiBaseUrl = '/vesta-web/admin/api';

        // Filtro de búsqueda
        // --- FILTROS ---
        document.getElementById('searchUser').addEventListener('keyup', applyFilters);

        function applyFilters() {
            const searchText = document.getElementById('searchUser').value.toLowerCase();
            const rolFilter = document.getElementById('filterRol').value;
            const statusFilter = document.getElementById('filterStatus').value;

            const rows = document.querySelectorAll('#userTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                
                // Rol en columna 6 (index 5) - OJO: Indices cambiaron al añadir columnas
                const rolCell = row.cells[5].innerText.trim();
                // Estado en columna 7 (index 6)
                const statusCell = row.cells[6].innerText.trim();

                let matchesSearch = text.includes(searchText);
                let matchesRol = rolFilter === '' || rolCell === rolFilter;
                let matchesStatus = statusFilter === '' || statusCell === statusFilter;

                row.style.display = (matchesSearch && matchesRol && matchesStatus) ? '' : 'none';
            });
        }
        
        function clearFilters() {
            document.getElementById('searchUser').value = '';
            document.getElementById('filterRol').value = '';
            document.getElementById('filterStatus').value = '';
            applyFilters();
        }

        // --- EXPORTAR ---
        function exportToExcel() {
            const table = document.querySelector("table");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Usuarios"});
            XLSX.writeFile(wb, "Reporte_Usuarios_Vesta.xlsx");
        }

        function verDetalle(id, nombre, email, ciudad, rol, movil, nacimiento, direccion) {
            document.getElementById('detailId').innerText = '#' + id;
            document.getElementById('detailNombre').innerText = nombre;
            document.getElementById('detailEmail').innerText = email;
            
            document.getElementById('detailCiudad').innerText = ciudad || 'No registrada';
            document.getElementById('detailRol').innerText = rol;
            
            document.getElementById('detailMovil').innerText = movil || '-';
            document.getElementById('detailNacimiento').innerText = nacimiento || '-';
            document.getElementById('detailDireccion').innerText = direccion || '-';

            new bootstrap.Modal(document.getElementById('modalUsuario')).show();
        }

        async function toggleEstado(id, nuevoEstado, nombre) {
            const accion = nuevoEstado ? 'DESBLOQUEAR' : 'BLOQUEAR';
            const color = nuevoEstado ? 'success' : 'danger';
            
            if (nuevoEstado === false) { 
                // BLOQUEAR REQUIERE CONFIRMACIÓN SEGURA
                showSafeDeleteModal(
                    'Confirmar Bloqueo',
                    `Para bloquear el acceso a <b>${nombre}</b>, escribe "BLOQUEAR" a continuación:`,
                    'BLOQUEAR',
                    async () => {
                        await ejecutarCambio(id, nuevoEstado, accion);
                    }
                );
            } else {
                // DESBLOQUEAR PUEDE SER ESTÁNDAR O SEGURO (USARÉ ESTÁNDAR PARA AGILIDAD, O SEGURO PARA CONSISTENCIA)
                // Usaré seguro para consistencia con el requisito de "edición/borrado seguro"
                showSafeDeleteModal(
                    'Confirmar Desbloqueo',
                    `Para reactivar a <b>${nombre}</b>, escribe "DESBLOQUEAR" a continuación:`,
                    'DESBLOQUEAR',
                    async () => {
                         await ejecutarCambio(id, nuevoEstado, accion);
                    }
                );
            }

            async function ejecutarCambio(id, estado, accionTxt) {
                try {
                    const res = await fetch(`${apiBaseUrl}/usuarios/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({ activo: estado })
                    });

                    if(res.ok) {
                        showSuccessModal('Éxito', `Usuario ${accionTxt.toLowerCase()} correctamente.`);
                        setTimeout(() => window.location.reload(), 1000);
                    } else {
                        showErrorModal('Error', 'No se pudo actualizar el estado.');
                    }
                } catch(e) {
                        showErrorModal('Error', 'Error de conexión.');
                }
            }
        }
    </script>
</body>
</html>
