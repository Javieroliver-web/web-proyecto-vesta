<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Usuarios - Vesta Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='usuarios')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-warning">👥 Gestión de Usuarios</h2>
                <div class="input-group w-25">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchUser" placeholder="Buscar por email...">
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr th:each="u : ${usuarios}">
                                <td class="text-muted fw-bold">#<span th:text="${u.id}">1</span></td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-circle bg-light text-primary me-2 rounded-circle d-flex align-items-center justify-content-center" style="width:35px;height:35px;">
                                            <i class="bi bi-person-fill"></i>
                                        </div>
                                        <span th:text="${u.nombreCompleto}">Nombre</span>
                                    </div>
                                </td>
                                <td th:text="${u.email}">email@example.com</td>
                                <td>
                                    <span th:class="${'badge ' + (u.rol == 'ADMIN' ? 'bg-warning text-dark' : 'bg-info bg-opacity-10 text-info border border-info')}" 
                                          th:text="${u.rol}">USER</span>
                                </td>
                                <td>
                                    <span th:if="${u.activo == true}" class="badge bg-success bg-opacity-10 text-success border border-success">ACTIVO</span>
                                    <span th:if="${u.activo == false}" class="badge bg-danger bg-opacity-10 text-danger border border-danger">BLOQUEADO</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary me-1" th:onclick="verDetalle([[${u.id}]], [[${u.nombreCompleto}]], [[${u.email}]], [[${u.ciudad}]], [[${u.rol}]])">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    
                                    <!-- Botón Bloquear/Desbloquear -->
                                    <div th:if="${u.rol != 'ADMIN'}" class="d-inline">
                                        <button th:if="${u.activo == true}" class="btn btn-sm btn-outline-danger" 
                                                th:onclick="toggleEstado([[${u.id}]], false, [[${u.nombreCompleto}]])">
                                            <i class="bi bi-ban"></i>
                                        </button>
                                        <button th:if="${u.activo == false}" class="btn btn-sm btn-outline-success" 
                                                th:onclick="toggleEstado([[${u.id}]], true, [[${u.nombreCompleto}]])">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="mb-3">
                        <i class="bi bi-person-circle display-1 text-secondary"></i>
                    </div>
                    <h4 id="detailNombre" class="fw-bold"></h4>
                    <p id="detailEmail" class="text-muted mb-4"></p>
                    
                    <div class="row text-start bg-light p-3 rounded mx-2">
                        <div class="col-6 mb-2"><small class="text-muted d-block">ID</small> <span id="detailId" class="fw-bold"></span></div>
                        <div class="col-6 mb-2"><small class="text-muted d-block">Rol</small> <span id="detailRol" class="fw-bold"></span></div>
                        <div class="col-12"><small class="text-muted d-block">Ciudad</small> <span id="detailCiudad"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/modal-utils.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const token = [[${session.token}]];
        /*]]>*/
        const apiBaseUrl = 'http://localhost:8080/api';

        // Filtro de búsqueda
        document.getElementById('searchUser').addEventListener('keyup', function() {
            const value = this.value.toLowerCase();
            const rows = document.querySelectorAll('#userTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(value) ? '' : 'none';
            });
        });

        function verDetalle(id, nombre, email, ciudad, rol) {
            document.getElementById('detailId').innerText = '#' + id;
            document.getElementById('detailNombre').innerText = nombre;
            document.getElementById('detailEmail').innerText = email;
            document.getElementById('detailCiudad').innerText = ciudad || 'No registrada';
            document.getElementById('detailRol').innerText = rol;
            new bootstrap.Modal(document.getElementById('modalUsuario')).show();
        }

        async function toggleEstado(id, nuevoEstado, nombre) {
            const accion = nuevoEstado ? 'DESBLOQUEAR' : 'BLOQUEAR';
            const color = nuevoEstado ? 'success' : 'danger';
            
            showConfirmModal(
                `Confirmar Acción`, 
                `¿Estás seguro de que deseas <b>${accion}</b> al usuario <b>${nombre}</b>?`,
                async () => {
                    try {
                        const res = await fetch(`${apiBaseUrl}/usuarios/${id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify({ activo: nuevoEstado })
                        });

                        if(res.ok) {
                            showSuccessModal('Éxito', `Usuario ${accion.toLowerCase()} correctamente.`);
                            setTimeout(() => window.location.reload(), 1000);
                        } else {
                            showErrorModal('Error', 'No se pudo actualizar el estado.');
                        }
                    } catch(e) {
                         showErrorModal('Error', 'Error de conexión.');
                    }
                }
            );
        }
    </script>
</body>
</html>
