<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Configuración Admin - Vesta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div th:replace="~{fragments/favicon :: favicon}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=3.4)}">
</head>

<body>
    <div class="d-flex flex-column flex-md-row">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='configuracion')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <h2 class="page-title-premium mb-4">Configuración Administrador</h2>

            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="list-group list-group-flush rounded-3">
                            <a href="#general" class="list-group-item list-group-item-action active"
                                data-bs-toggle="list">
                                <i class="bi bi-sliders me-2"></i> General
                            </a>
                            <a href="#seguridad" class="list-group-item list-group-item-action" data-bs-toggle="list">
                                <i class="bi bi-shield-lock me-2"></i> Seguridad
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div class="tab-content">

                        <!-- PESTAÑA GENERAL -->
                        <div class="tab-pane fade show active" id="general">
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-transparent border-0 pt-4 px-4">
                                    <h5 class="fw-bold mb-0">Apariencia</h5>
                                </div>
                                <div class="card-body px-4 pb-4">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="fw-bold mb-1">Modo Oscuro</h6>
                                            <p class="text-muted small mb-0">Cambia entre tema claro y oscuro.</p>
                                        </div>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="themeToggle"
                                                style="width: 3em; height: 1.5em; cursor: pointer;">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PESTAÑA SEGURIDAD -->
                        <div class="tab-pane fade" id="seguridad">
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-transparent border-0 pt-4 px-4">
                                    <h5 class="fw-bold mb-0">Cambiar Contraseña</h5>
                                </div>
                                <div class="card-body px-4 pb-4">
                                    <form id="passwordForm">
                                        <div class="mb-3">
                                            <label class="form-label">Contraseña Actual <span
                                                    class="text-danger">*</span></label>
                                            <input type="password" class="form-control" id="currentPassword" required>
                                        </div>
                                        <hr class="my-4">
                                        <div class="mb-3">
                                            <label class="form-label">Nueva Contraseña</label>
                                            <input type="password" class="form-control" id="newPassword" required
                                                minlength="6">
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label">Confirmar Contraseña</label>
                                            <input type="password" class="form-control" id="confirmPassword" required
                                                minlength="6">
                                        </div>
                                        <div class="d-grid justify-content-md-end">
                                            <button type="submit" class="btn btn-warning text-white">Actualizar</button>
                                        </div>
                                    </form>
                                    <div id="msgBox" class="mt-3" style="display:none"></div>
                                </div>
                            </div>

                            <!-- 2FA -->
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-header bg-transparent border-0 pt-4 px-4">
                                    <h5 class="fw-bold mb-0">Autenticación (2FA)</h5>
                                </div>
                                <div class="card-body px-4 pb-4">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <div>
                                            <p class="mb-0 text-muted">Protege tu cuenta de administrador.</p>
                                            <span id="2faBadge" class="badge bg-secondary mt-2">Desactivado</span>
                                        </div>
                                        <button id="btnToggle2FA" class="btn btn-outline-warning"
                                            onclick="setup2FA()">Configurar</button>
                                    </div>

                                    <div id="2faSetupArea" class="mt-4 p-4 bg-light rounded-3" style="display:none;">
                                        <div class="text-center my-3">
                                            <div class="bg-white p-2 rounded d-inline-block">
                                                <canvas id="qrCanvas"></canvas>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <input type="text" class="form-control text-center" id="verify2faInput"
                                                placeholder="Código 6 dígitos" maxlength="6">
                                        </div>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-warning w-100 text-white"
                                                onclick="verifyAndEnable2FA()">Activar</button>
                                            <button class="btn btn-outline-secondary w-100"
                                                onclick="cancel2FASetup()">Cancelar</button>
                                        </div>
                                        <div id="2faMsg" class="mt-2 text-danger small text-center"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- CUENTAS VINCULADAS -->
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-transparent border-0 pt-4 px-4">
                                    <h5 class="fw-bold mb-0">Cuentas Vinculadas</h5>
                                </div>
                                <div class="card-body px-4 pb-4">
                                    <p class="text-muted small">Inicia sesión rápidamente con tus cuentas sociales.</p>

                                    <!-- Google -->
                                    <div
                                        class="d-flex align-items-center justify-content-between mb-3 p-3 bg-light rounded-3">
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="bg-white p-2 rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                                                style="width: 40px; height: 40px;">
                                                <img src="https://www.svgrepo.com/show/475656/google-color.svg"
                                                    alt="Google" width="24" height="24">
                                            </div>
                                            <div>
                                                <h6 class="fw-bold mb-0">Google</h6>
                                                <small class="text-muted" id="status-google">No vinculado</small>
                                            </div>
                                        </div>
                                        <button class="btn btn-sm btn-outline-warning" id="btn-google"
                                            onclick="toggleLink('google')">Vincular</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
            <div id="liveToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert"
                aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body d-flex align-items-center gap-2">
                        <i id="toastIcon" class="bi"></i>
                        <strong id="toastMessage" class="me-auto"></strong>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/modal-utils.js}"></script>
        <script th:inline="javascript">
            const userId = /*[[${usuarioId}]]*/ null;
            const token = /*[[${session.token}]]*/ null;
            const apiBaseUrl = '/vesta-web/usuario/api';
            const apiTwoFactorUrl = '/vesta-web/auth/api/2fa';

            // --- TEMA ---
            const toggle = document.getElementById('themeToggle');
            const root = document.documentElement;

            async function loadSettings() {
                try {
                    const res = await fetch(`${apiBaseUrl}/${userId}`, {
                        credentials: 'include'
                    });
                    if (res.ok) {
                        const user = await res.json();
                        if (user.tema) {
                            localStorage.setItem('theme', user.tema);
                            root.setAttribute('data-theme', user.tema);
                            toggle.checked = (user.tema === 'dark');
                        }
                        // Google account check - ALWAYS update UI based on provider
                        if (user.provider && user.provider === 'google') {
                            updateLinkUI('google', true);
                        } else {
                            updateLinkUI('google', false);
                        }
                    }
                    // Check 2FA
                    const res2fa = await fetch(`${apiTwoFactorUrl}/status`, { headers: { 'Authorization': 'Bearer ' + token } });
                    if (res2fa.ok) {
                        const data = await res2fa.json();
                        update2FAUI(data.data);

                    }
                } catch (e) { }
            }
            loadSettings();

            toggle.addEventListener('change', async function () {
                const newTheme = this.checked ? 'dark' : 'light';
                root.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                await fetch(`${apiBaseUrl}/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ tema: newTheme })
                });
            });

            // --- PASSWORD ---
            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const currentPass = document.getElementById('currentPassword').value;
                const p1 = document.getElementById('newPassword').value;
                const p2 = document.getElementById('confirmPassword').value;
                const msgBox = document.getElementById('msgBox');

                if (p1 !== p2) {
                    msgBox.style.display = 'block'; msgBox.className = 'alert alert-danger'; msgBox.innerText = 'No coinciden'; return;
                }

                try {
                    const res = await fetch(`${apiBaseUrl}/${userId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ currentPassword: currentPass, newPassword: p1 })
                    });
                    if (res.ok) {
                        msgBox.style.display = 'block'; msgBox.className = 'alert alert-success'; msgBox.innerText = 'Contraseña actualizada';
                        document.getElementById('passwordForm').reset();
                    } else {
                        const d = await res.json();
                        msgBox.style.display = 'block'; msgBox.className = 'alert alert-danger'; msgBox.innerText = d.message || 'Error';
                    }
                } catch (e) { msgBox.style.display = 'block'; msgBox.className = 'alert alert-danger'; msgBox.innerText = 'Error red'; }
            });

            // --- 2FA ---
            function update2FAUI(isEnabled) {
                const badge = document.getElementById('2faBadge');
                const btn = document.getElementById('btnToggle2FA');
                if (isEnabled) {
                    badge.className = 'badge bg-success mt-2'; badge.innerText = 'Activado';
                    btn.className = 'btn btn-outline-danger'; btn.innerText = 'Desactivar';
                    btn.onclick = disable2FA;
                } else {
                    badge.className = 'badge bg-secondary mt-2'; badge.innerText = 'Desactivado';
                    btn.className = 'btn btn-outline-warning'; btn.innerText = 'Configurar';
                    btn.onclick = setup2FA;
                }
            }

            async function setup2FA() {
                const res = await fetch(`${apiTwoFactorUrl}/setup`, { headers: { 'Authorization': 'Bearer ' + token } });
                const d = await res.json();
                if (res.ok) {
                    document.getElementById('2faSetupArea').style.display = 'block';
                    new QRious({ element: document.getElementById('qrCanvas'), value: d.data.qrCodeUrl, size: 150 });
                }
            }
            function cancel2FASetup() { document.getElementById('2faSetupArea').style.display = 'none'; }

            async function verifyAndEnable2FA() {
                const code = document.getElementById('verify2faInput').value;
                const res = await fetch(`${apiTwoFactorUrl}/verify-setup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ code: code })
                });
                if (res.ok) {
                    cancel2FASetup(); update2FAUI(true);
                } else {
                    document.getElementById('2faMsg').innerText = 'Código incorrecto';
                }
            }

            function disable2FA() {
                showConfirmModal('Desactivar 2FA', '¿Desactivar 2FA? Tu cuenta será menos segura.', async () => {
                    await fetch(`${apiTwoFactorUrl}/disable`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
                    update2FAUI(false);
                });
            }

            // --- LINKED ACCOUNTS ---
            function updateLinkUI(provider, isLinked) {
                const statusEl = document.getElementById(`status-${provider}`);
                const btnEl = document.getElementById(`btn-${provider}`);

                if (isLinked) {
                    statusEl.innerText = 'Vinculado';
                    statusEl.className = 'text-success fw-bold';
                    btnEl.innerText = 'Desvincular';
                    btnEl.className = 'btn btn-sm btn-outline-danger';
                    btnEl.disabled = true; // Disable unlinking for OAuth users
                } else {
                    statusEl.innerText = 'No vinculado';
                    statusEl.className = 'text-muted';
                    btnEl.innerText = 'Vincular';
                    btnEl.className = 'btn btn-sm btn-outline-warning';
                }
            }

            function toggleLink(provider) {
                window.location.href = `/vesta-web/oauth2/authorization/${provider}`;
            }
        </script>
</body>

</html>
