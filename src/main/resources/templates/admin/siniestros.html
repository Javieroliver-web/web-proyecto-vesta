<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Gestión de Siniestros - Vesta Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div th:replace="~{fragments/favicon :: favicon}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=3.6)}">
</head>

<body>
    <div class="d-flex flex-column flex-md-row">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='siniestros')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title-premium">Gestión de Siniestros</h2>
                <div>
                    <button class="btn btn-outline-secondary me-2" onclick="window.location.reload()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
                    </button>
                    <button class="btn btn-success" onclick="exportToExcel()">
                        <i class="bi bi-file-earmark-excel me-2"></i>Exportar Excel
                    </button>
                </div>
            </div>

            <!-- Toolbar de Filtros -->
            <div class="card shadow-sm border-0 mb-4 bg-light">
                <div class="card-body py-3">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <div class="search-expandable position-relative">
                                <input type="text" id="searchInput" placeholder="Buscar por descripción o ID..."
                                    class="form-control pe-5" th:value="${search}" autocomplete="off">
                                <i class="bi bi-x-circle-fill position-absolute top-50 end-0 translate-middle-y me-5 text-secondary cursor-pointer"
                                    id="clearSearch" style="display: none; cursor: pointer; z-index: 10;"></i>
                                <div class="search-expandable-icon">
                                    <i class="bi bi-search"></i>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="filterEstado">
                                <option value="" th:selected="${estado == null or estado == ''}">Todos los Estados
                                </option>
                                <option value="PENDIENTE_REVISION" th:selected="${estado == 'PENDIENTE_REVISION'}">Pendiente Revisión</option>
                                <option value="APROBADO" th:selected="${estado == 'APROBADO'}">Aprobado</option>
                                <option value="RECHAZADO" th:selected="${estado == 'RECHAZADO'}">Rechazado</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-outline-secondary w-100" id="btnLimpiarTodo">
                                <i class="bi bi-x-circle me-1"></i>Limpiar Todo
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden" id="resultsContainer">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Tipo de Siniestro</th>
                                <th>Estado</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${siniestros}">
                                <td class="ps-4 fw-bold text-muted">#<span th:text="${s.id}">1</span></td>
                                <td th:text="${s.fecha}">2024-01-01</td>
                                <td>
                                    <div class="d-flex flex-column">
                                        <span class="fw-bold"
                                            th:text="${s.poliza != null && s.poliza.usuario != null ? s.poliza.usuario.nombreCompleto : 'N/A'}">Juan
                                            Pérez</span>
                                        <small class="text-muted"
                                            th:text="${s.poliza != null && s.poliza.usuario != null ? s.poliza.usuario.email : 'N/A'}">juan@example.com</small>
                                    </div>
                                </td>
                                <td
                                    th:text="${s.poliza != null && s.poliza.producto != null ? s.poliza.producto.categoria : 'N/A'}">
                                    ACCIDENTE</td>
                                <td>
                                    <span th:if="${s.estado == 'PENDIENTE' || s.estado == 'PENDIENTE_REVISION'}"
                                        class="badge shadow-sm px-3"
                                        style="background-color: #f1a61c !important; color: #000 !important; font-weight: 800;">PENDIENTE</span>
                                    <span th:if="${s.estado == 'EN_PROCESO'}" class="badge shadow-sm px-3"
                                        style="background-color: #0dcaf0 !important; color: #000 !important; font-weight: 800;">EN
                                        PROCESO</span>
                                    <span th:if="${s.estado == 'RESUELTO' || s.estado == 'APROBADO'}"
                                        class="badge shadow-sm px-3"
                                        style="background-color: #198754 !important; color: #fff !important; font-weight: 800;">APROBADO</span>
                                    <span th:if="${s.estado == 'RECHAZADO'}" class="badge shadow-sm px-3"
                                        style="background-color: #dc3545 !important; color: #fff !important; font-weight: 800;">RECHAZADO</span>
                                    <span
                                        th:if="${s.estado != 'PENDIENTE' && s.estado != 'PENDIENTE_REVISION' && s.estado != 'EN_PROCESO' && s.estado != 'RESUELTO' && s.estado != 'APROBADO' && s.estado != 'RECHAZADO'}"
                                        class="badge bg-secondary shadow-sm px-3" th:text="${s.estado}">ESTADO</span>
                                </td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-outline-primary me-1"
                                        th:onclick="verDetalleSiniestro([[${s.id}]])" title="Ver Detalle">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <!-- El botón de aceptar ahora solo aparece dentro del detalle -->
                                    <button th:if="${s.estado == 'EN_PROCESO'}"
                                        class="btn btn-sm btn-outline-success me-1"
                                        th:onclick="gestionarSiniestro([[${s.id}]], 'RESUELTO')" title="Resolver">
                                        <i class="bi bi-flag-fill"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(siniestros)}">
                                <td colspan="6" class="text-center py-5 text-muted">No se encontraron siniestros con
                                    esos filtros.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginación -->
                <div class="card-footer bg-white py-3 border-0" th:if="${totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/siniestros(page=${currentPage - 1}, search=${search}, estado=${estado})}">Anterior</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link"
                                    th:href="@{/admin/siniestros(page=${i}, search=${search}, estado=${estado})}"
                                    th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/siniestros(page=${currentPage + 1}, search=${search}, estado=${estado})}">Siguiente</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalSiniestro" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold">Detalle de Siniestro #<span id="detailId"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0" id="detailBody">
                    <!-- Contenido dinámico cargado por JS -->
                </div>
                <div class="modal-footer bg-light border-0 py-3" id="modalFooter">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cerrar</button>
                    <!-- Botones dinámicos -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/modal-utils.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const token = /*[[${session.token}]]*/ null;
        const apiBaseUrl = '/vesta-web/admin/api/siniestros';

        function getHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        async function verDetalleSiniestro(id) {
            try {
                const res = await fetch(`${apiBaseUrl}/${id}`, { credentials: 'include' });
                if (!res.ok) throw new Error();
                const s = await res.json();

                const container = document.getElementById('detailBody');
                const footer = document.getElementById('modalFooter');

                // Construir URL de imagen
                const imgUrl = s.imagenUrl ? (window.location.origin + '/vesta-api/' + s.imagenUrl) : null;
                const riskLabel = s.fraudeScore > 70 ? 'Riesgo Crítico' : (s.fraudeScore > 30 ? 'Riesgo Medio' : 'Riesgo Bajo');
                const riskClass = s.fraudeScore > 70 ? 'bg-danger' : (s.fraudeScore > 30 ? 'bg-warning text-dark' : 'bg-success');

                container.innerHTML = `
                    <div class="row g-0">
                        <!-- Lado izquierdo: Imagen -->
                        <div class="col-md-6 bg-dark d-flex align-items-center justify-content-center p-3" style="min-height: 400px;">
                            ${imgUrl ? `
                                <img src="${imgUrl}" class="img-fluid rounded shadow" style="max-height: 350px; object-fit: contain;" 
                                     onerror="this.parentElement.innerHTML='<div class=\'text-white-50\'><i class=\'bi bi-image display-1\'></i><p>Imagen no disponible</p></div>'">
                            ` : `
                                <div class="text-white-50 text-center">
                                    <i class="bi bi-image display-1"></i>
                                    <p>Sin evidencia visual</p>
                                </div>
                            `}
                        </div>
                        
                        <!-- Lado derecho: Info -->
                        <div class="col-md-6 p-4">
                            <!-- Info Cliente y Póliza -->
                            <div class="mb-4 p-3 bg-light rounded shadow-sm border">
                                <h6 class="fw-bold mb-3"><i class="bi bi-person-vcard text-primary me-2"></i>Cliente</h6>
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-person-circle text-muted me-2"></i>
                                    <span class="fw-bold">${s.poliza?.usuario?.nombreCompleto || 'Usuario Demo'}</span>
                                </div>
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-envelope text-muted me-2"></i>
                                    <small class="text-muted">${s.poliza?.usuario?.email || 'demo@vesta.com'}</small>
                                </div>
                                <div class="d-flex align-items-center">
                                    <i class="bi bi-shield-check text-muted me-2"></i>
                                    <small class="text-muted">Póliza #${s.poliza?.id || 'N/A'}</small>
                                </div>
                            </div>

                            <h6 class="fw-bold small text-muted text-uppercase mb-2">Declaración del Cliente:</h6>
                            <div class="p-3 bg-light rounded mb-4 fst-italic border" style="min-height: 80px;">
                                "${s.descripcion}"
                            </div>

                            <hr class="my-3">

                            <h6 class="fw-bold text-primary mb-2"><i class="bi bi-robot me-2"></i>Análisis IA Vesta</h6>
                            <div class="p-3 small mb-4 rounded shadow-sm fw-bold border" style="background-color: #1a3a5f !important; color: #ffffff !important; border-color: #3b82f6 !important; font-size: 0.95rem;">
                                <i class="bi bi-info-circle-fill me-2 text-info"></i>${s.analisisIA || 'Análisis no disponible'}
                            </div>

                            <h6 class="fw-bold text-danger small text-uppercase mb-2">
                                <i class="bi bi-shield-exclamation me-1"></i>Score de Fraude
                            </h6>
                            <div class="d-flex align-items-center">
                                <h2 class="mb-0 me-3 fw-bold">${s.fraudeScore}%</h2>
                                <span class="badge ${riskClass} px-3 py-2 rounded-pill">${riskLabel}</span>
                            </div>
                        </div>
                    </div>
                `;

                // Botones del footer: Siempre permitir Aprobar/Rechazar para facilitar cambios
                footer.innerHTML = `
                    <div class="w-100 d-flex justify-content-center gap-3">
                        <button type="button" class="btn btn-danger px-5 py-2 shadow-sm fw-bold" onclick="gestionarSiniestro(${s.id}, 'RECHAZADO')">
                            <i class="bi bi-x-circle me-2"></i>Rechazar
                        </button>
                        <button type="button" class="btn btn-success px-5 py-2 shadow-sm fw-bold" onclick="gestionarSiniestro(${s.id}, 'RESUELTO')">
                            <i class="bi bi-check-circle me-2"></i>Aprobar
                        </button>
                    </div>
                `;

                if (s.estado !== 'PENDIENTE' && s.estado !== 'PENDIENTE_REVISION') {
                    const statusColor = s.estado === 'RECHAZADO' ? 'text-danger' : 'text-success';
                    const notice = document.createElement('div');
                    notice.className = 'w-100 text-center mb-3 p-2 border rounded bg-light small shadow-sm';
                    notice.innerHTML = `Este siniestro ya está <span class="fw-bold ${statusColor}">${s.estado}</span>. Puedes cambiar la decisión si lo deseas.`;
                    footer.prepend(notice);
                }

                document.getElementById('detailId').innerText = id;
                new bootstrap.Modal(document.getElementById('modalSiniestro')).show();
            } catch (e) {
                showErrorModal('Error', 'No se pudo cargar el detalle del siniestro.');
            }
        }

        function gestionarSiniestro(id, nuevoEstado) {
            const accionTxt = nuevoEstado === 'RESUELTO' ? 'APROBAR' : 'RECHAZAR';
            showConfirmModal(
                'Confirmar Acción',
                `¿Estás seguro de que deseas <b>${accionTxt}</b> el siniestro #${id}?`,
                async () => {
                    try {
                        const res = await fetch(`${apiBaseUrl}/${id}/estado`, {
                            method: 'PUT',
                            headers: getHeaders(),
                            body: JSON.stringify({ estado: nuevoEstado })
                        });

                        if (res.ok) {
                            showSuccessModal('Éxito', 'Estado actualizado correctamente.');
                            setTimeout(() => window.location.reload(), 1500);
                        } else {
                            const data = await res.json();
                            showErrorModal('Error', data.message || 'No se pudo actualizar el estado.');
                        }
                    } catch (e) {
                        console.error(e);
                        showErrorModal('Error de Conexión', 'No se pudo conectar con el servidor.');
                    }
                }
            );
        }

        // --- LÓGICA DE FILTROS AJAX (Debounced) ---
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('searchInput');
            const filterEstado = document.getElementById('filterEstado');
            const clearBtn = document.getElementById('clearSearch');
            const btnLimpiarTodo = document.getElementById('btnLimpiarTodo');
            const resultsContainer = document.getElementById('resultsContainer');
            let debounceTimer;

            // Init state
            toggleClearButton();

            // Input Listener
            searchInput.addEventListener('input', function () {
                toggleClearButton();
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => performSearch(), 500);
            });

            // Evento Tecla Enter
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            // Clear Button
            clearBtn.addEventListener('click', function () {
                searchInput.value = '';
                toggleClearButton();
                performSearch();
            });

            // Clear All
            btnLimpiarTodo.addEventListener('click', function () {
                searchInput.value = '';
                filterEstado.value = '';
                toggleClearButton();
                performSearch();
            });

            // IMPORTANTE: Agregar listener al select aquí en lugar de usar onchange inline
            filterEstado.addEventListener('change', function () {
                performSearch();
            });

            function toggleClearButton() {
                const hasContent = searchInput.value.trim().length > 0;
                clearBtn.style.display = hasContent ? 'block' : 'none';
                const container = searchInput.closest('.search-expandable');
                if (container) container.classList.toggle('active', hasContent);
            }

            function performSearch() {
                const query = searchInput.value;
                const status = filterEstado.value;
                console.log('🔍 performSearch - query:', query, 'status:', status);
                
                const url = new URL(window.location.href);
                if (query) url.searchParams.set('search', query); else url.searchParams.delete('search');
                if (status) url.searchParams.set('estado', status); else url.searchParams.delete('estado');
                url.searchParams.set('page', 0);

                console.log('🔍 Nueva URL:', url.toString());
                
                // Recargar la página con los nuevos parámetros
                window.location.href = url.toString();
            }
        });
        /*]]>*/
    </script>
</body>

</html>
