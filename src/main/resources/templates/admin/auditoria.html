<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Auditoría de Acciones - Vesta Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div th:replace="~{fragments/favicon :: favicon}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=3.6)}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
</head>

<body>
    <div class="d-flex flex-column flex-md-row">
        <!-- Sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar(activeTab='auditoria')}"></div>

        <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title-premium">Auditoría de Seguridad</h2>
                <!-- Search Expandable -->
                <div class="col-md-6 d-flex justify-content-end align-items-center">
                    <div class="search-expandable position-relative">
                        <input type="text" id="searchInput" class="form-control rounded-pill pe-5"
                            placeholder="Filtrar por usuario o acción..." th:value="${search}" autocomplete="off">
                        <i class="bi bi-x-circle-fill position-absolute top-50 end-0 translate-middle-y me-5 text-secondary cursor-pointer"
                            id="clearSearch" style="display: none; cursor: pointer; z-index: 10;"></i>
                        <div class="search-expandable-icon">
                            <i class="bi bi-search"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div id="resultsContainer">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="bi bi-terminal me-2"></i> System Logs
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover table-striped align-middle mb-0 font-monospace"
                            style="font-size: 0.9rem;">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Usuario</th>
                                    <th>Acción</th>
                                    <th>Detalle</th>
                                    <th>IP</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td class="text-muted" th:text="${#strings.substring(log.fecha, 0, 19)}">2026-01-01
                                        10:00:00</td>
                                    <td class="fw-bold text-primary" th:text="${log.usuarioEmail}">admin@vesta.com</td>
                                    <td>
                                        <span
                                            th:class="${'badge ' + (log.accion.contains('DELETE') || log.accion.contains('BAN') ? 'bg-danger' : (log.accion.contains('UPDATE') ? 'bg-warning text-dark' : 'bg-info text-dark'))}"
                                            th:text="${log.accion}">LOGIN</span>
                                    </td>
                                    <td th:text="${log.detalle}">Detalles...</td>
                                    <td class="text-muted small" th:text="${log.ip}">127.0.0.1</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(logs)}">
                                    <td colspan="5" class="text-center py-5 text-muted">No hay registros de actividad
                                        recientes.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination Controls -->
                <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/admin/auditoria(page=${currentPage - 1}, search=${search})}">Anterior</a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link">Página <span th:text="${currentPage + 1}">1</span> de <span
                                    th:text="${totalPages}">1</span></span>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/admin/auditoria(page=${currentPage + 1}, search=${search})}">Siguiente</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearch');
            const resultsContainer = document.getElementById('resultsContainer');
            let debounceTimer;

            // Mostrar/Ocultar botón limpiar al cargar
            toggleClearButton();

            // Evento Input (Debounced Search)
            searchInput.addEventListener('input', function () {
                toggleClearButton();
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    performSearch(this.value);
                }, 500); // 500ms delay
            });

            // Evento Limpiar
            clearBtn.addEventListener('click', function () {
                searchInput.value = '';
                toggleClearButton();
                performSearch('');
            });

            // Evento Tecla Enter (Manual fallback since we removed the form tag or for better control)
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    performSearch(this.value);
                }
            });

            function toggleClearButton() {
                const hasContent = searchInput.value.trim().length > 0;
                clearBtn.style.display = hasContent ? 'block' : 'none';
                const container = searchInput.closest('.search-expandable');
                if (container) container.classList.toggle('active', hasContent);
            }

            function performSearch(query) {
                const url = new URL(window.location.href);
                url.searchParams.set('search', query);
                url.searchParams.set('page', 0); // Reset a page 0 on new search

                // Update URL without reload (History API)
                window.history.pushState({}, '', url);

                fetch(url)
                    .then(response => response.text())
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const newContent = doc.getElementById('resultsContainer').innerHTML;
                        resultsContainer.innerHTML = newContent;
                    })
                    .catch(err => console.error('Error fetching search results:', err));
            }
        });
    </script>
</body>

</html>
