<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV Virtual - Vesta Seguros</title>
    <div th:replace="~{fragments/favicon :: favicon}"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --vesta-gold: #f1a61c;
            --vesta-navy: #282c3f;
            --vesta-dark: #141620;
        }

        body {
            background: linear-gradient(135deg, var(--vesta-navy) 0%, var(--vesta-dark) 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .tpv-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .tpv-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .tpv-header {
            background: linear-gradient(135deg, var(--vesta-gold) 0%, #f4b94c 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .card-visual {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 1.5rem;
            color: white;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .card-visual::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .card-number {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            letter-spacing: 0.2rem;
            margin: 1rem 0;
        }

        .test-cards {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        .test-card-item {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .test-card-item:hover {
            background: rgba(var(--vesta-gold), 0.1);
        }

        .processing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .processing-content {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--vesta-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-pay {
            background: linear-gradient(135deg, var(--vesta-gold) 0%, #f4b94c 100%);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            color: white;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1200px) {
            .container {
                max-width: 100%;
                padding-left: 20px;
                padding-right: 20px;
            }
        }

        @media (max-width: 992px) {
            .row.g-4 {
                --bs-gutter-x: 1.5rem;
                --bs-gutter-y: 1.5rem;
            }
            
            .card-body {
                padding: 1.25rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding-left: 15px;
                padding-right: 15px;
            }
            
            .row.g-4 {
                --bs-gutter-x: 1rem;
                --bs-gutter-y: 1rem;
            }
            
            .card-body {
                padding: 1rem;
            }
            
            .btn-pay {
                padding: 0.875rem 1.5rem;
                font-size: 1rem;
            }
            
            .form-control {
                padding: 0.75rem;
                font-size: 0.95rem;
            }
            
            .form-label {
                font-size: 0.9rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            h3 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 576px) {
            .container {
                padding-left: 10px;
                padding-right: 10px;
            }
            
            .row.g-4 {
                --bs-gutter-x: 0.75rem;
                --bs-gutter-y: 0.75rem;
            }
            
            .card-body {
                padding: 0.75rem;
            }
            
            .btn-pay {
                padding: 0.75rem 1.25rem;
                font-size: 0.95rem;
                width: 100%;
            }
            
            .form-control {
                padding: 0.65rem;
                font-size: 0.9rem;
            }
            
            .form-label {
                font-size: 0.85rem;
            }
            
            h1 {
                font-size: 1.75rem;
                text-align: center;
            }
            
            h2 {
                font-size: 1.3rem;
            }
            
            h3 {
                font-size: 1.1rem;
            }
            
            .col-md-6 {
                margin-bottom: 1rem;
            }
            
            .row {
                margin-left: -5px;
                margin-right: -5px;
            }
            
            .col-md-6,
            .col-lg-8,
            .col-lg-4 {
                padding-left: 5px;
                padding-right: 5px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding-left: 5px;
                padding-right: 5px;
            }
            
            .card-body {
                padding: 0.5rem;
            }
            
            .btn-pay {
                padding: 0.65rem 1rem;
                font-size: 0.9rem;
            }
            
            .form-control {
                padding: 0.5rem;
                font-size: 0.85rem;
            }
            
            .form-label {
                font-size: 0.8rem;
                margin-bottom: 0.25rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            h2 {
                font-size: 1.2rem;
            }
            
            h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="tpv-container">
        <div class="tpv-card">
            <div class="tpv-header">
                <h2><i class="bi bi-credit-card-2-front me-2"></i>TPV Virtual</h2>
                <p class="mb-0">Simulador de Terminal Punto de Venta</p>
            </div>

            <div class="p-4">
                <!-- Resumen de compra -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <h5>Resumen de Compra</h5>
                        <div class="bg-light p-3 rounded">
                            <!-- Lista de productos -->
                            <div id="cartItems" class="mb-3">
                                <!-- Se llenará dinámicamente con JavaScript -->
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <span><strong>Total a pagar:</strong></span>
                                <strong class="text-success" id="totalAmount">€0.00</strong>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5>Tarjetas de Prueba</h5>
                        <div class="test-cards">
                            <small class="text-muted">Haz clic para usar:</small>
                            <div id="testCards"></div>
                        </div>
                    </div>
                </div>

                <!-- Formulario de tarjeta -->
                <form id="paymentForm">
                    <div class="row">
                        <div class="col-12">
                            <div class="card-visual">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <small>BANCO SIMULADO</small>
                                    </div>
                                    <i class="bi bi-credit-card fs-2"></i>
                                </div>
                                <div class="card-number" id="cardDisplay">**** **** **** ****</div>
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <small>TITULAR</small>
                                        <div id="holderDisplay">NOMBRE APELLIDOS</div>
                                    </div>
                                    <div>
                                        <small>VÁLIDA HASTA</small>
                                        <div id="expiryDisplay">MM/AA</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label">Número de Tarjeta</label>
                                <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">CVV</label>
                                <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Titular</label>
                                <input type="text" class="form-control" id="cardHolder" placeholder="NOMBRE APELLIDOS" required>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="mb-3">
                                <label class="form-label">Mes</label>
                                <select class="form-control" id="expiryMonth" required>
                                    <option value="">MM</option>
                                    <option value="01">01</option>
                                    <option value="02">02</option>
                                    <option value="03">03</option>
                                    <option value="04">04</option>
                                    <option value="05">05</option>
                                    <option value="06">06</option>
                                    <option value="07">07</option>
                                    <option value="08">08</option>
                                    <option value="09">09</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="mb-3">
                                <label class="form-label">Año</label>
                                <select class="form-control" id="expiryYear" required>
                                    <option value="">AA</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>
                                    <option value="27">27</option>
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-pay btn-lg">
                            <i class="bi bi-credit-card me-2"></i>Procesar Pago
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Overlay de procesamiento -->
    <div class="processing-overlay" id="processingOverlay">
        <div class="processing-content">
            <div class="spinner"></div>
            <h4>Procesando Pago...</h4>
            <p class="text-muted">Conectando con el banco...</p>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <div th:replace="~{fragments/mobile-nav :: mobile-nav}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        // Datos del carrito (pasados desde el controlador)
        const cartData = /*[[${cartData}]]*/ {};
        const totalAmount = /*[[${totalAmount}]]*/ 0;

        document.addEventListener('DOMContentLoaded', function() {
            // Mostrar items del carrito
            displayCartItems();
            
            // Mostrar total
            document.getElementById('totalAmount').textContent = `€${totalAmount.toFixed(2)}`;

            // Cargar tarjetas de prueba
            loadTestCards();

            // Configurar eventos
            setupCardFormatting();
            setupFormSubmission();
        });

        function displayCartItems() {
            const cartItemsContainer = document.getElementById('cartItems');
            if (cartData && cartData.items && cartData.items.length > 0) {
                const itemsHtml = cartData.items.map(item => `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <small class="fw-bold">${item.nombre}</small>
                            <br>
                            <small class="text-muted">€${parseFloat(item.precio).toFixed(2)} × ${item.cantidad}</small>
                        </div>
                        <span class="fw-bold">€${parseFloat(item.subtotal).toFixed(2)}</span>
                    </div>
                `).join('');
                cartItemsContainer.innerHTML = itemsHtml;
            } else {
                cartItemsContainer.innerHTML = `
                    <div class="text-center py-4">
                        <i class="bi bi-cart-x fs-1 text-muted"></i>
                        <p class="text-muted mt-2 mb-0">No hay pagos pendientes</p>
                        <small class="text-muted">Todos tus pagos han sido procesados</small>
                    </div>
                `;
                
                // Deshabilitar el formulario si no hay items
                const form = document.getElementById('paymentForm');
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Sin pagos pendientes';
                    submitBtn.classList.remove('btn-pay');
                    submitBtn.classList.add('btn-secondary');
                }
            }
        }

        function loadTestCards() {
            fetch('/vesta-web/cliente/api/tpv/tarjetas-prueba')
                .then(response => response.json())
                .then(cards => {
                    const container = document.getElementById('testCards');
                    Object.entries(cards).forEach(([number, description]) => {
                        const item = document.createElement('div');
                        item.className = 'test-card-item';
                        item.innerHTML = `<small><strong>${number}</strong><br>${description}</small>`;
                        item.onclick = () => useTestCard(number);
                        container.appendChild(item);
                    });
                });
        }

        function useTestCard(number) {
            document.getElementById('cardNumber').value = number;
            document.getElementById('cardHolder').value = 'USUARIO PRUEBA';
            document.getElementById('expiryMonth').value = '12';
            document.getElementById('expiryYear').value = '25';
            document.getElementById('cvv').value = '123';
            updateCardDisplay();
        }

        function setupCardFormatting() {
            const cardNumber = document.getElementById('cardNumber');
            const cardHolder = document.getElementById('cardHolder');
            const expiryMonth = document.getElementById('expiryMonth');
            const expiryYear = document.getElementById('expiryYear');

            cardNumber.addEventListener('input', function() {
                // Formatear número de tarjeta
                let value = this.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
                let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
                this.value = formattedValue;
                updateCardDisplay();
            });

            [cardHolder, expiryMonth, expiryYear].forEach(input => {
                input.addEventListener('input', updateCardDisplay);
            });
        }

        function updateCardDisplay() {
            const number = document.getElementById('cardNumber').value || '**** **** **** ****';
            const holder = document.getElementById('cardHolder').value || 'NOMBRE APELLIDOS';
            const month = document.getElementById('expiryMonth').value || 'MM';
            const year = document.getElementById('expiryYear').value || 'AA';

            document.getElementById('cardDisplay').textContent = number;
            document.getElementById('holderDisplay').textContent = holder.toUpperCase();
            document.getElementById('expiryDisplay').textContent = `${month}/${year}`;
        }

        function setupFormSubmission() {
            document.getElementById('paymentForm').addEventListener('submit', function(e) {
                e.preventDefault();
                processPayment();
            });
        }

        function processPayment() {
            const overlay = document.getElementById('processingOverlay');
            overlay.style.display = 'flex';

            const paymentData = {
                usuarioId: /*[[${usuarioId}]]*/ 1,
                items: cartData.items || [],
                numeroTarjeta: document.getElementById('cardNumber').value.replace(/\s/g, ''),
                mesExpiracion: document.getElementById('expiryMonth').value,
                anoExpiracion: document.getElementById('expiryYear').value,
                cvv: document.getElementById('cvv').value,
                nombreTitular: document.getElementById('cardHolder').value
            };

            fetch('/vesta-web/cliente/api/checkout-tpv', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(paymentData)
            })
            .then(response => response.json())
            .then(result => {
                overlay.style.display = 'none';
                if (result.error) {
                    showResult(false, result.error);
                } else {
                    showResult(true, `Pago procesado exitosamente. Referencia: ${result.referencia}`);
                }
            })
            .catch(error => {
                overlay.style.display = 'none';
                showResult(false, 'Error de conexión: ' + error.message);
            });
        }

        function showResult(success, message) {
            const alertClass = success ? 'alert-success' : 'alert-danger';
            const icon = success ? 'bi-check-circle' : 'bi-x-circle';
            
            const alert = document.createElement('div');
            alert.className = `alert ${alertClass} alert-dismissible fade show`;
            alert.innerHTML = `
                <i class="bi ${icon} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.querySelector('.tpv-card .p-4').insertBefore(alert, document.getElementById('paymentForm'));
            
            if (success) {
                setTimeout(() => {
                    window.location.href = '/vesta-web/cliente/dashboard';
                }, 3000);
            }
        }
    </script>
</body>
</html>
